name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build, test and package
        shell: pwsh
        run: ./scripts/Build.ps1 -OutputDirectory "$env:GITHUB_WORKSPACE/artifacts/release"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            artifacts/release/*.zip
            artifacts/release/*.sha256
            artifacts/release/self-test.txt
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-x64
          path: artifacts
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG"
          artifacts/*.zip artifacts/*.sha256 artifacts/self-test.txt
          --verify-tag --title "UEFontTool $RELEASE_TAG"
          --notes-file CHANGELOG.md
